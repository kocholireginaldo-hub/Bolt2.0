services:
  - type: web
    name: alma-do-carro
    runtime: node
    plan: free
    buildCommand: echo "sem build"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_WIFI_BRIDGE
        value: "0"
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
